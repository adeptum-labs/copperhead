name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cache the browsers Playwright drives
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install the libraries Chromium needs
        run: npx --yes playwright@1.63.0 install-deps chromium
      - name: Build and test, the browser tests included
        run: mvn -B install -Pbrowser
      - name: Rebuild the editor bundle and compare it with the committed one
        run: |
          ui/frontend/build.sh
          git diff --exit-code -- ui/src/main/resources/static/js/editor.bundle.js \
            ui/src/main/resources/static/js/editor.bundle.js.provenance
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Fetch, compile and run vasm and Shrinkler, and build both templates
        run: mvn -B verify -Ptoolchain -pl toolchain -am
      - name: Keep the template disks for the boot test
        uses: actions/upload-artifact@v7
        with:
          name: template-disks
          path: toolchain/target/disks/*.adf
          if-no-files-found: error

  boot:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: template-disks
          path: disks
      - name: Install FS-UAE, Xvfb and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fs-uae xvfb imagemagick
      - name: Boot the demo template, crunched
        run: .github/scripts/boot-smoke.sh disks/nightrun.adf nightrun.png
      - name: Boot the demo template, not crunched
        run: .github/scripts/boot-smoke.sh disks/daybreak.adf daybreak.png
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-screenshots
          path: '*.png'
          if-no-files-found: ignore
