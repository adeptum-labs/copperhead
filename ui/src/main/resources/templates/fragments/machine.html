<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="machine" id="machine" class="machine" hx-swap-oob="true">
			<div class="machine__target" role="group" title="Target machine">
				<button class="machine__chipset" type="button" th:classappend="${!view.aga()} ? 'machine__chipset--on'"
					hx-post="/action/target" hx-vals='{"target":"OCS"}'>OCS</button>
				<button class="machine__chipset" type="button" th:classappend="${view.aga()} ? 'machine__chipset--on'"
					hx-post="/action/target" hx-vals='{"target":"AGA"}'>AGA</button>
			</div>
			<button class="button button--accent button--strong machine__run" type="button" hx-post="/action/run"><span
				th:text="${view.running()} ? '❚❚' : '▶'">▶</span> <span
				th:text="${view.running()} ? 'Pause' : 'Run'">Run</span></button>
			<button class="button button--strong" type="button" hx-post="/action/build"
				hx-vals="js:{...copperhead.editor.buffers({})}" th:disabled="${!view.buildable()}">Build ADF</button>
		</div>
	</body>
</html>
