<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="build" class="build">
			<div class="build__cards">
				<section class="card card--roomy">
					<h3 class="card__title">Target</h3>
					<button class="build__choice" type="button" th:each="target : ${view.targets()}"
						hx-post="/action/target" th:hx-vals="${target.vals()}">
						<span th:text="${target.selected()} ? '■' : '□'">■</span>
						<span th:text="${target.label()} + ' · ' + ${target.memory()}">A500 · OCS</span>
					</button>
				</section>
				<section class="card card--roomy">
					<h3 class="card__title">Options</h3>
					<button class="build__choice" type="button" th:each="option : ${view.options()}"
						hx-post="/action/build-option" th:hx-vals="${option.vals()}">
						<span th:text="${option.on()} ? '■' : '□'">■</span>
						<span th:text="${option.label()}">Shrinkler -9</span>
					</button>
				</section>
				<section class="card card--roomy card--wide">
					<h3 class="card__title">Toolchain</h3>
					<div class="build__tool" th:each="tool : ${view.tools()}">
						<span class="build__tool-name" th:text="${tool.name()}">vasm 2.0f</span>
						<span class="build__tool-state" th:classappend="${tool.found()} ? 'build__tool-state--found'"
							th:text="${tool.found()} ? 'found' : 'will fetch'">found</span>
						<span class="build__tool-where" th:text="${tool.where()}">/usr/local/bin/vasmm68k_mot</span>
					</div>
					<button class="button button--small build__fetch" type="button" hx-post="/action/toolchain-fetch"
						th:disabled="${!view.fetchable()}">Fetch now</button>
				</section>
			</div>
			<pre class="build__log"><span class="build__line" th:each="line : ${view.log()}"
				th:classappend="'build__line--' + ${line.tone()}" th:text="${line.text()}"></span></pre>
			<div class="build__bar">
				<button class="button button--accent button--strong button--large" type="button"
					hx-post="/action/build" hx-vals="js:{...copperhead.editor.buffers({})}"
					th:disabled="${!view.buildable()}">Build ADF</button>
				<button class="button button--large" type="button" hx-post="/action/build-run"
					hx-vals="js:{...copperhead.editor.buffers({})}" th:disabled="${!view.buildable()}">Build &amp; run</button>
				<button class="button button--large button--danger" type="button" hx-post="/action/build-cancel"
					th:if="${view.running()}">Cancel</button>
				<span class="build__summary" th:text="${view.summary()}">demo.adf · 1,031 bytes · 0.9s · A500</span>
			</div>
		</div>
	</body>
</html>
