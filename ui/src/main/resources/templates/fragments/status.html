<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<body>
		<footer th:fragment="status" id="status" class="status" hx-swap-oob="true" th:attr="data-theme=${view.theme()},data-project=${view.project()},data-saved=${view.savedList()}">
			<span th:text="${view.tool()}">vasm 2.0f</span>
			<button class="status__error" type="button" th:if="${view.failed()}" hx-post="/action/goto-warning"
				th:text="${view.errors()}">Build failed · 1 error</button>
			<span class="status__ok" th:unless="${view.failed()}" th:text="${view.errors()}">0 errors</span>
			<button class="status__warning" type="button" th:if="${view.warns()}" hx-post="/action/goto-warning"
				th:text="${view.warnings()}">1 warning · main.s:24</button>
			<span class="status__warnings" th:unless="${view.warns()}" th:text="${view.warnings()}">0 warnings</span>
			<span class="status__build" th:text="${view.lastBuild()}">last build 1,031 bytes · 0.9s</span>
			<span class="status__note" th:unless="${view.note().isEmpty()}" th:text="${view.note()}"></span>
			<span class="status__spacer"></span>
			<span class="status__part" th:text="${view.part()}">Part 03 · Plasma</span>
			<span class="status__frame">frame <span data-frame th:text="${view.frame()}">1170</span></span>
			<span class="status__machine" th:text="${view.machine()}">A500 · OCS</span>
			<span hidden data-poll th:if="${view.polling()}" hx-post="/action/build-progress" hx-trigger="every 500ms"
				th:hx-vals="${view.poll()}"></span>
		</footer>
	</body>
</html>
