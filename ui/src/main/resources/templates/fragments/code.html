<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<body>
		<div th:fragment="code" class="code" data-editor-host>
			<div class="code__editor" data-editor></div>
			<script type="application/json" data-source th:utext="${view.source()}">{}</script>
			<div class="code__controls" hidden>
				<button type="button" data-editor-control="breakpoint" hx-post="/action/breakpoint"
					hx-vals="js:{...copperhead.editor.line()}"></button>
				<button type="button" data-editor-control="cursor" hx-post="/action/cursor"
					hx-vals="js:{...copperhead.editor.cursor()}"></button>
			</div>
		</div>
	</body>
</html>
